name: Stable release checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.platform.target }} / Go ${{ matrix.go }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.10', '1.27.3']
        platform:
          - runner: macos-15
            target: darwin_arm64
          - runner: macos-15-intel
            target: darwin_amd64
          - runner: ubuntu-24.04
            target: linux_amd64
          - runner: windows-2022
            target: windows_amd64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.sum
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Verify dependencies and Go code
        run: |
          go version
          git --version
          go mod verify
          go vet ./...
          go test -race -v ./...
      - name: Prepare native binary
        env:
          CANDIDATE: ${{ matrix.go == '1.27.3' && 'true' || 'false' }}
          EXPECT_TARGET: ${{ matrix.platform.target }}
        run: |
          python - <<'PY'
          import os, pathlib, subprocess
          from tools.release import native_target
          assert native_target() == os.environ['EXPECT_TARGET']
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          suffix = '.exe' if os.name == 'nt' else ''
          if os.environ['CANDIDATE'] == 'true':
              subprocess.run(['python', 'tools/release.py', 'build', '--version', 'v2.0.0'], check=True)
              subprocess.run(['python', 'tools/release.py', 'verify', '--version', 'v2.0.0', '--commit', sha], check=True)
              binary = pathlib.Path('dist/installed/orbit' + suffix).resolve()
              version = 'v2.0.0'
          else:
              binary = pathlib.Path('orbit' + suffix).resolve()
              subprocess.run(['go', 'build', '-o', str(binary), './src'], check=True)
              version, sha = 'dev', 'unknown'
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as out:
              out.write(f'ORBIT_BIN={binary}\nORBIT_EXPECT_VERSION={version}\nORBIT_EXPECT_COMMIT={sha}\n')
          PY
      - name: Functional acceptance against native binary
        run: python -m unittest discover -s tests/acceptance -v
      - name: Synthetic configuration repair checks
        run: python -m unittest discover -s tests -p test_synthetic_config.py -v
      - name: Upload verified native package
        if: matrix.go == '1.27.3'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-${{ matrix.platform.target }}
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.json
  candidate:
    name: Verify complete candidate
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - name: Check source identity and generate checksums
        run: python tools/release.py checksums --version v2.0.0 --commit "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: orbit-v2.0.0-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.json
            dist/SHA256SUMS
